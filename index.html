<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Boy Advance Online - Lucas</title>
  
  <!-- Logo de la pestaña de la página web -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Lucas2026apks/Room-gba/main/logo.png">

  <!-- Estilos CSS integrados para una interfaz moderna y limpia -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1, h2 {
      margin-bottom: 15px;
      color: #38bdf8;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .card {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #0ea5e9;
    }

    .btn-secondary {
      background-color: #334155;
      color: #f8fafc;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .btn-danger {
      background-color: #ef4444;
      color: #fff;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    #error-msg, #auth-error {
      color: #f87171;
      font-size: 13px;
      text-align: center;
    }

    /* Contenedor del Emulador */
    #emulator-wrapper {
      width: 100%;
      max-width: 640px;
      height: 480px;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    #game {
      width: 100%;
      height: 100%;
    }

    /* Estilos de la Tienda de Juegos / Listas */
    .game-list-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 350px;
      overflow-y: auto;
    }

    .game-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      gap: 10px;
    }

    .game-cover {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
      background-color: #334155;
    }

    .game-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .game-actions {
      display: flex;
      gap: 5px;
    }

    .game-actions button {
      padding: 6px 10px;
      font-size: 12px;
    }

    .btn-test {
      background-color: #10b981;
      color: #fff;
    }
    .btn-test:hover {
      background-color: #059669;
    }

    .btn-download {
      background-color: #6366f1;
      color: #fff;
    }
    .btn-download:hover {
      background-color: #4f46e5;
    }

    .user-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 640px;
      margin-bottom: 15px;
      background-color: #1e293b;
      padding: 10px 15px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- SECCIÓN 1: AUTENTICACIÓN (LOGIN / REGISTRO) -->
  <div id="auth-section" class="card">
    <h2>🎮 GBA Cloud Emulator</h2>
    <input type="email" id="email-input" placeholder="Correo electrónico">
    <input type="password" id="password-input" placeholder="Contraseña">
    <button id="btn-login">Iniciar Sesión</button>
    <button id="btn-register" class="btn-secondary">Registrarse</button>
    <p id="auth-error"></p>
  </div>

  <!-- SECCIÓN 2: PANEL DE CONTROL Y MENÚ PRINCIPAL -->
  <div id="game-section" class="card hidden" style="max-width: 640px;">
    <div class="user-panel">
      <span style="font-size: 14px;" id="user-email-display">usuario@email.com</span>
      <button id="btnLogout" class="btn-danger" style="padding: 6px 12px; font-size: 12px;">Cerrar Sesión</button>
    </div>

    <h2>Menú Principal</h2>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <button id="btn-goto-store" style="flex: 1;">🛒 Tienda de Juegos (GitHub)</button>
      <button id="btn-goto-import" class="btn-secondary" style="flex: 1;">📂 Importar ROM Local</button>
    </div>
    
    <!-- Input oculto para buscar ROMs locales en la PC/Celular -->
    <input type="file" id="rom-input" accept=".gba" class="hidden">

    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button id="btn-save-cloud" class="btn-test" style="flex: 1;">💾 Guardar Partida en Nube</button>
      <button id="btn-load-cloud" class="btn-download" style="flex: 1;">☁️ Cargar Partida de Nube</button>
    </div>
  </div>

  <!-- SECCIÓN 3: TIENDA DE JOYAS / ROMS DE GITHUB -->
  <div id="store-section" class="card hidden" style="max-width: 640px;">
    <h2>🛒 Tienda Oficial de ROMs</h2>
    <div id="game-list" class="game-list-container">
      <!-- Los juegos cargados desde app.js se pintarán aquí automáticamente -->
    </div>
    <button id="btn-back-store" class="btn-secondary" style="margin-top: 10px;">⬅️ Volver al Menú</button>
  </div>

  <!-- SECCIÓN 4: CONTENEDOR DEL EMULADOR GBA -->
  <div id="emulator-wrapper" class="hidden">
    <div id="game"></div>
  </div>

  <!-- SECCIÓN 5: TOP GLOBAL DE TIEMPO JUGADO -->
  <div id="ranking-section" class="card hidden" style="max-width: 640px;">
    <h2>🏆 Top Global de Jugadores</h2>
    <div id="ranking-list" class="game-list-container" style="max-height: 200px;">
      <!-- El ranking Firestore aparecerá aquí -->
    </div>
  </div>

  <!-- Carga del archivo JavaScript principal como módulo -->
  <script type="module" src="app.js"></script>
</body>
  </html>
