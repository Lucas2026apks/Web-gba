<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Boy Advance Cloud Studio</title>
  
  <!-- Logo de la pestaña -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Lucas2026apks/Room-gba/main/logo.png">

  <style>
    :root {
      --bg-dark: #0d1117;
      --bg-panel: #161b22;
      --bg-card: #21262d;
      --accent: #6c5ce7;
      --accent-hover: #818cf8;
      --text-main: #f0f6fc;
      --text-dim: #8b949e;
      --border: #30363d;
      --green: #238636;
      --red: #da3633;
      --yellow: #d29922;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }

    /* LAYOUT PRINCIPAL */
    aside {
      width: 280px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 32px;
      height: 32px;
    }

    .brand h2 {
      font-size: 1.1rem;
      color: var(--text-main);
      font-weight: 700;
    }

    .user-badge {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-dim);
      word-break: break-all;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-btn {
      background: transparent;
      color: var(--text-dim);
      border: none;
      padding: 12px;
      border-radius: 8px;
      text-align: left;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .nav-btn:hover, .nav-btn.active {
      background-color: var(--accent);
      color: #fff;
    }

    main {
      flex: 1;
      padding: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
    }

    .container-panel {
      width: 100%;
      max-width: 900px;
      background-color: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    /* CONTROLES Y FORMULARIO */
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }

    .btn-block { width: 100%; margin-bottom: 10px; }
    .btn-primary { background-color: var(--accent); color: #fff; }
    .btn-green { background-color: var(--green); color: #fff; }
    .btn-yellow { background-color: var(--yellow); color: #000; }
    .btn-red { background-color: var(--red); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }

    /* TARJETAS DE ARCHIVOS / JUEGOS */
    .grid-folders {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .folder-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .folder-card:hover {
      border-color: var(--accent);
    }

    .game-item {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      gap: 15px;
    }

    .game-cover {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--bg-dark);
    }

    .game-info {
      flex: 1;
    }

    .game-actions {
      display: flex;
      gap: 8px;
    }

    /* CONTENEDOR DEL EMULADOR */
    #emulator-wrapper {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #game {
      width: 100%;
      aspect-ratio: 3 / 2;
      max-height: 500px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .emulator-controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      width: 100%;
      justify-content: center;
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      aside { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      main { padding: 15px; }
    }
  </style>
</head>
<body>

  <!-- BARRA LATERAL / NAVEGACIÓN -->
  <aside>
    <div class="brand">
      <img src="https://raw.githubusercontent.com/Lucas2026apks/Room-gba/main/logo.png" alt="GBA Logo">
      <h2>GBA Cloud Player</h2>
    </div>

    <div id="user-badge" class="user-badge hidden">
      <span>👤 <strong id="user-email-display"></strong></span>
    </div>

    <nav id="nav-menu" class="hidden">
      <button id="nav-btn-emu" class="nav-btn active">🎮 Emulador</button>
      <button id="nav-btn-store" class="nav-btn">📂 Explorador ROMs</button>
      <button id="nav-btn-ranking" class="nav-btn">🏆 Top Global</button>
      <button id="btn-goto-import" class="nav-btn">📥 Importar .GBA</button>
      <input type="file" id="rom-input" accept=".gba" style="display: none;">
      <button id="btn-logout" class="nav-btn btn-red" style="margin-top: 20px;">🚪 Cerrar Sesión</button>
    </nav>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main>

    <!-- SECCIÓN: AUTENTICACIÓN -->
    <div id="auth-section" class="container-panel" style="max-width: 400px;">
      <h3 style="text-align: center; margin-bottom: 10px;">Acceso al Sistema</h3>
      <p style="text-align: center; font-size: 13px; color: var(--text-dim); margin-bottom: 20px;">
        Inicia sesión para jugar y sincronizar partidas en la nube.
      </p>

      <input type="email" id="email-input" placeholder="Correo electrónico">
      <input type="password" id="password-input" placeholder="Contraseña">

      <button id="btn-login" class="btn btn-primary btn-block">Iniciar Sesión</button>
      <button id="btn-register" class="btn btn-outline btn-block">Crear Cuenta</button>

      <p id="auth-error" style="color: var(--red); text-align: center; font-size: 13px; margin-top: 10px;"></p>
    </div>

    <!-- SECCIÓN: EXPLORADOR DE ARCHIVOS / ROMS -->
    <div id="store-section" class="container-panel hidden">
      <h3 style="margin-bottom: 5px;">📂 Explorador de ROMs</h3>
      <p style="font-size: 13px; color: var(--text-dim); margin-bottom: 20px;">Selecciona una categoría de juegos disponible en el servidor:</p>

      <!-- Vista 1: Carpetas -->
      <div id="folder-view" class="grid-folders"></div>

      <!-- Vista 2: Contenido de la Carpeta -->
      <div id="folder-content-view" class="hidden">
        <button id="btn-back-folders" class="btn btn-outline" style="margin-bottom: 15px;">⬅️ Volver a Categorías</button>
        <h4 id="folder-title-display" style="color: var(--accent-hover); margin-bottom: 15px;"></h4>
        <div id="games-in-folder-list"></div>
      </div>
    </div>

    <!-- SECCIÓN: TOP GLOBAL -->
    <div id="ranking-section" class="container-panel hidden" style="max-width: 500px;">
      <h3 style="margin-bottom: 5px;">🏆 Top Global de Jugadores</h3>
      <p style="font-size: 13px; color: var(--text-dim); margin-bottom: 15px;">Tiempo total registrado en el emulador:</p>
      <div id="ranking-list"></div>
    </div>

    <!-- SECCIÓN: EMULADOR GBA -->
    <div id="emulator-wrapper" class="hidden">
      <div id="game"></div>

      <!-- Panel de Control de Guardado -->
      <div class="emulator-controls">
        <button id="btn-save-cloud" class="btn btn-green">💾 Guardar en Nube</button>
        <button id="btn-load-cloud" class="btn btn-yellow">☁️ Cargar de Nube</button>
      </div>
    </div>

  </main>

  <script type="module" src="./app.js"></script>
</body>
  </html>
