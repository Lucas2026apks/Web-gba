<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Boy Advance Virtual</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121824;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2, h3 {
      text-align: center;
    }
    .card {
      background-color: #1e2535;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-login { background-color: #f472b6; color: #fff; }
    .btn-register { background-color: #db2777; color: #fff; }
    .btn-logout { background-color: #ef4444; color: #fff; width: auto; padding: 5px 15px; }
    .btn-store { background-color: #8b5cf6; color: #fff; }
    .btn-import { background-color: #3b82f6; color: #fff; }
    .btn-save { background-color: #22c55e; color: #fff; }
    .btn-load { background-color: #eab308; color: #fff; }
    .hidden { display: none !important; }
    #auth-error { color: #f87171; text-align: center; font-size: 14px; }
    
    /* Estilos del Emulador y Secciones */
    #emulator-wrapper {
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
    }
    #game {
      width: 100%;
      height: 400px;
      background: #000;
      margin-top: 10px;
      border-radius: 8px;
    }
    .store-container {
      background-color: #1e2535;
      padding: 15px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
    }
    
    /* Estilo de los elementos de la tienda con imagen y botones duales */
    .game-item {
      display: flex;
      align-items: center;
      background: #2a3447;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      gap: 10px;
    }
    .game-cover {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 5px;
      background: #121824;
      flex-shrink: 0;
    }
    .game-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .game-actions {
      display: flex;
      gap: 5px;
    }
    .game-actions button {
      width: auto;
      padding: 5px 10px;
      font-size: 12px;
      margin: 0;
    }
    .btn-test { background-color: #10b981; color: white; }
    .btn-download { background-color: #3b82f6; color: white; }
  </style>
</head>
<body>

  <h2>🎮 GBA Cloud Player</h2>

  <!-- SECCIÓN DE AUTENTICACIÓN -->
  <div id="auth-section" class="card">
    <h3>Ingresar</h3>
    <p style="text-align:center; font-size:13px; color:#9ca3af;">Inicia sesión para jugar y guardar partidas</p>
    
    <input type="email" id="email-input" placeholder="Correo electrónico">
    <input type="password" id="password-input" placeholder="Contraseña">
    
    <button id="btn-login" class="btn-login">Iniciar Sesión</button>
    <button id="btn-register" class="btn-register">Crear Cuenta</button>
    
    <p id="auth-error"></p>
  </div>

  <!-- SECCIÓN PRINCIPAL (MENÚ DE DOS BOTONES + NUBE) -->
  <div id="game-section" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="user-email-display" style="font-size: 13px; color: #cbd5e1;"></span>
      <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
    </div>
    <hr style="border-color: #2a3447; margin: 15px 0;">
    
    <h3>Menú Principal</h3>
    <button id="btn-goto-store" class="btn-store">🛒 Ir a la Tienda de Juegos</button>
    <button id="btn-goto-import" class="btn-import">📂 Importar juego .gba</button>
    <input type="file" id="rom-input" accept=".gba" style="display: none;">

    <hr style="border-color: #2a3447; margin: 15px 0;">
    <h3>Gestión de Partida</h3>
    <button id="btn-save-cloud" class="btn-save">💾 Guardar Partida en Nube</button>
    <button id="btn-load-cloud" class="btn-load">☁️ Cargar Partida de Nube</button>
  </div>

  <!-- TIENDA DE JUEGOS -->
  <div id="store-section" class="store-container hidden">
    <h3>🛒 Tienda de Juegos (GitHub)</h3>
    <div style="font-size: 12px; color: #9ca3af; text-align: center; margin-bottom: 10px;">Selecciona un juego:</div>
    <div id="game-list"></div>
    <button id="btn-back-store" style="margin-top: 15px; background-color: #475569; color: white;">⬅️ Volver al Menú</button>
  </div>

  <!-- TOP GLOBAL DE TIEMPO JUGADO -->
  <div id="ranking-section" class="store-container hidden">
    <h3>🏆 Top Global - Tiempo Jugado</h3>
    <div style="font-size: 12px; color: #9ca3af; text-align: center; margin-bottom: 10px;">Estadísticas en vivo:</div>
    <div id="ranking-list"></div>
  </div>

  <!-- CONTENEDOR DEL EMULADOR -->
  <div id="emulator-wrapper" class="hidden">
    <h3>🕹️ Emulador GBA</h3>
    <div id="game"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
      </html>
