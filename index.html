<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBA Cyber Studio</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Lucas2026apks/Room-gba/main/logo.png">

  <style>
    :root {
      --bg-dark: #0b0c10;
      --bg-panel: #1f2833;
      --bg-card: #0b0c10;
      --neon-cyan: #45f3ff;
      --neon-purple: #c5a1ff;
      --text-main: #66fcf1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }
    .hidden { display: none !important; }

    /* LAYOUT PRINCIPAL */
    aside {
      width: 280px;
      background-color: var(--bg-panel);
      border-right: 2px solid var(--neon-cyan);
      box-shadow: 5px 0 20px rgba(69, 243, 255, 0.2);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 36px; height: 36px; filter: drop-shadow(0 0 8px var(--neon-cyan)); }
    .brand h2 { font-size: 1.1rem; color: #fff; text-shadow: 0 0 10px var(--neon-cyan); letter-spacing: 1px; }

    nav { display: flex; flex-direction: column; gap: 10px; }
    .nav-btn {
      background: var(--neon-cyan);
      color: var(--bg-dark);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s;
    }

    .nav-btn:hover, .nav-btn.active {
      background: var(--bg-panel);
      color: var(--neon-cyan);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 15px rgba(69, 243, 255, 0.6);
    }

    .nav-btn-secondary { background: var(--neon-purple); }
    .nav-btn-secondary:hover { color: var(--neon-purple); border-color: var(--neon-purple); }

    main { flex: 1; padding: 25px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
    .container-panel {
      width: 100%;
      max-width: 950px;
      background-color: var(--bg-panel);
      border: 2px solid var(--neon-cyan);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0px 0px 25px rgba(69, 243, 255, 0.3);
    }

    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .btn-green { background-color: var(--neon-cyan); color: var(--bg-dark); }
    .btn-green:hover { background-color: var(--bg-panel); color: var(--neon-cyan); border: 2px solid var(--neon-cyan); }
    .btn-yellow { background-color: var(--neon-purple); color: var(--bg-dark); }
    .btn-yellow:hover { background-color: var(--bg-panel); color: var(--neon-purple); border: 2px solid var(--neon-purple); }

    /* GRID DE CATEGORÍAS */
    #folderView {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .folder-card {
      background: var(--bg-card);
      border: 2px dashed var(--neon-cyan);
      padding: 15px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .folder-card:hover {
      border-style: solid;
      box-shadow: 0 0 15px rgba(69, 243, 255, 0.6);
      transform: translateY(-2px);
    }

    /* GRID DE JUEGOS Y TARJETAS DE ROMS */
    .grid-juegos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 15px;
    }

    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--neon-cyan);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      box-shadow: 0 0 10px rgba(69, 243, 255, 0.15);
    }

    .card-img-wrapper img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--neon-purple);
    }

    .card-info h3 { font-size: 0.9rem; color: #fff; margin-bottom: 8px; }

    .btn-jugar, .btn-volver {
      background-color: var(--neon-cyan);
      color: var(--bg-dark);
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-jugar:hover, .btn-volver:hover {
      background-color: var(--bg-panel);
      color: var(--neon-cyan);
      outline: 1px solid var(--neon-cyan);
    }

    /* CONTENEDOR EMULADOR Y CONTROLES */
    #emulatorModal {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #game {
      width: 100%;
      aspect-ratio: 3 / 2;
      max-height: 500px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 25px rgba(69, 243, 255, 0.5);
    }

    .emulator-controls {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      width: 100%;
      justify-content: center;
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      aside { width: 100%; border-right: none; border-bottom: 2px solid var(--neon-cyan); }
      main { padding: 15px; }
    }
  </style>
</head>
<body>

  <!-- BARRA LATERAL DE NAVEGACIÓN -->
  <aside>
    <div class="brand">
      <img src="https://raw.githubusercontent.com/Lucas2026apks/Room-gba/main/logo.png" alt="Logo" onerror="this.style.display='none'">
      <h2>GBA CYBER STUDIO</h2>
    </div>

    <nav>
      <button id="nav-btn-store" class="nav-btn active">⚡ EXPLORADOR ROMS</button>
      <button id="nav-btn-emu" class="nav-btn nav-btn-secondary">🎮 EMULADOR</button>
      <button id="btn-goto-import" class="nav-btn nav-btn-secondary">📁 IMPORTAR .GBA</button>
      <input type="file" id="rom-input" accept=".gba" style="display: none;">
    </nav>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main>
    <!-- EXPLORADOR DE CARPETAS Y ROMS -->
    <div id="store-section" class="container-panel">
      <h3 style="margin-bottom: 5px; color: #fff; text-shadow: 0 0 10px var(--neon-cyan);">⚡ BIBLIOTECA DE JUEGOS GBA</h3>
      <p style="font-size: 13px; color: var(--neon-purple); margin-bottom: 20px;">SELECCIONA UNA CATEGORÍA O UN JUEGO PARA EMPEZAR:</p>
      
      <!-- Contenedor de carpetas -->
      <div id="folderView"></div>

      <!-- Contenedor de juegos dentro de carpeta -->
      <div id="folderContentView" class="hidden"></div>
    </div>

    <!-- CONTENEDOR DEL EMULADOR Y GUARDADO LOCAL -->
    <div id="emulatorModal" class="container-panel hidden">
      <div id="game"></div>
      <div class="emulator-controls">
        <button id="btn-save-local" class="btn btn-green">💾 GUARDAR PARTIDA LOCAL</button>
        <button id="btn-load-local" class="btn btn-yellow">📂 CARGAR PARTIDA LOCAL</button>
      </div>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
