<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMULADOR WEB - GBA Cyber Studio</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Lucas2026apks/Room-gba/main/logo.png">
  
  <!-- VÍNCULO PARA PWA (INSTALACIÓN DIRECTA TIPO APP) -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#45f3ff">

  <style>
    /* TEMAS DE COLOR (VARIABLES CSS) */
    :root {
      --bg-dark: #0b0c10;
      --bg-panel: #1f2833;
      --bg-card: #0b0c10;
      --neon-primary: #45f3ff;   /* Cyan / Default */
      --neon-secondary: #c5a1ff; /* Purple */
      --text-main: #66fcf1;
    }

    body.theme-naranja {
      --neon-primary: #ff9900;
      --neon-secondary: #ffcc00;
      --text-main: #ffe680;
    }

    body.theme-azul {
      --neon-primary: #0088ff;
      --neon-secondary: #00f0ff;
      --text-main: #80c4ff;
    }

    body.theme-rojo {
      --neon-primary: #ff2a2a;
      --neon-secondary: #ff7575;
      --text-main: #ff9999;
    }

    body.theme-rosado {
      --neon-primary: #ff007f;
      --neon-secondary: #ff80bf;
      --text-main: #ffb3d9;
    }

    body.theme-verde {
      --neon-primary: #39ff14;
      --neon-secondary: #a3ff00;
      --text-main: #b3ffb3;
    }

    /* ANIMACIÓN EFECTO RGB TECLADO */
    @keyframes rgbGlow {
      0% { --neon-primary: #ff0000; --neon-secondary: #ff7700; --text-main: #ff9999; }
      17% { --neon-primary: #ff7700; --neon-secondary: #ffff00; --text-main: #ffeb99; }
      33% { --neon-primary: #39ff14; --neon-secondary: #00ffaa; --text-main: #b3ffb3; }
      50% { --neon-primary: #00f0ff; --neon-secondary: #0088ff; --text-main: #99ebff; }
      67% { --neon-primary: #000cff; --neon-secondary: #8b00ff; --text-main: #b3b3ff; }
      83% { --neon-primary: #ff007f; --neon-secondary: #ff0000; --text-main: #ffb3d9; }
      100% { --neon-primary: #ff0000; --neon-secondary: #ff7700; --text-main: #ff9999; }
    }

    body.theme-rgb {
      animation: rgbGlow 6s linear infinite;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; transition: background-color 0.3s; }
    .hidden { display: none !important; }
    
    /* PANTALLA DE INICIO (LANDING PAGE A PANTALLA COMPLETA) */
    #welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-dark);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .welcome-card {
      background: var(--bg-panel);
      border: 2px solid var(--neon-primary);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 15px var(--neon-primary);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .welcome-card h1 {
      font-size: 2.2rem;
      color: #fff;
      text-shadow: 0 0 15px var(--neon-primary);
      letter-spacing: 2px;
      font-weight: 800;
    }

    /* BOTÓN INSTALAR APP TIPO TINKERCAD */
    .btn-install-app {
      background: #39ff14 !important;
      color: #0b0c10 !important;
      border: 2px solid #39ff14 !important;
      font-size: 1rem !important;
      font-weight: 900 !important;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
      animation: pulseGlow 2s infinite;
    }

    .btn-install-app:hover {
      background: #0b0c10 !important;
      color: #39ff14 !important;
      box-shadow: 0 0 25px #39ff14;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px rgba(57, 255, 20, 0.4); }
      50% { box-shadow: 0 0 25px rgba(57, 255, 20, 0.8); }
      100% { box-shadow: 0 0 10px rgba(57, 255, 20, 0.4); }
    }

    .welcome-consoles {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* BOTONES DE CONSOLAS */
    .console-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--neon-primary);
      color: #fff;
      padding: 14px 18px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .console-btn .btn-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .console-btn img {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .console-btn.active:hover {
      background: var(--neon-primary);
      color: var(--bg-dark);
      box-shadow: 0 0 20px var(--neon-primary);
      transform: translateY(-2px);
    }

    .console-btn.disabled {
      background: rgba(255, 255, 255, 0.03);
      border-color: #333;
      color: #666;
      cursor: not-allowed;
    }

    .badge-disabled {
      font-size: 0.65rem;
      background: #222;
      color: #888;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid #333;
    }

    /* CONTENEDOR PRINCIPAL DE LA APP */
    #app-container {
      display: flex;
      min-height: 100vh;
      width: 100vw;
    }

    /* BARRA LATERAL DE NAVEGACIÓN */
    aside {
      width: 280px;
      background-color: var(--bg-panel);
      border-right: 2px solid var(--neon-primary);
      box-shadow: 5px 0 20px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 15px;
      flex-shrink: 0;
    }

    .brand-sidebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    .brand-sidebar h2 {
      font-size: 1.1rem;
      color: #fff;
      text-shadow: 0 0 10px var(--neon-primary);
      letter-spacing: 1px;
    }

    .btn-switch-console {
      background: transparent;
      border: 1px solid var(--neon-primary);
      color: var(--neon-primary);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-switch-console:hover {
      background: var(--neon-primary);
      color: var(--bg-dark);
    }

    nav { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    
    .nav-btn {
      background: var(--neon-primary);
      color: var(--bg-dark);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
      transition: background 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .nav-btn:hover, .nav-btn.active {
      background: var(--bg-panel);
      color: var(--neon-primary);
      border: 2px solid var(--neon-primary);
      box-shadow: 0 0 15px var(--neon-primary);
    }
    .nav-btn-secondary { background: var(--neon-secondary); }
    .nav-btn-secondary:hover { color: var(--neon-secondary); border-color: var(--neon-secondary); }
    
    /* MENÚ DESPLEGABLE DE PERSONALIZACIÓN */
    .theme-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--neon-primary);
      padding: 10px;
      border-radius: 8px;
      margin-top: 5px;
    }
    .theme-opt {
      background: transparent;
      color: #fff;
      border: 1px solid transparent;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.2s;
    }
    .theme-opt:hover {
      border-color: var(--neon-primary);
      color: var(--neon-primary);
      background: var(--bg-panel);
    }

    main { flex: 1; padding: 25px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
    .container-panel {
      width: 100%;
      max-width: 950px;
      background-color: var(--bg-panel);
      border: 2px solid var(--neon-primary);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0px 0px 25px rgba(0, 0, 0, 0.5);
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      transition: all 0.3s;
    }
    .btn-green { background-color: var(--neon-primary); color: var(--bg-dark); }
    .btn-green:hover { background-color: var(--bg-panel); color: var(--neon-primary); border: 2px solid var(--neon-primary); }
    .btn-yellow { background-color: var(--neon-secondary); color: var(--bg-dark); }
    .btn-yellow:hover { background-color: var(--bg-panel); color: var(--neon-secondary); border: 2px solid var(--neon-secondary); }
    
    /* GRID DE CATEGORÍAS */
    #folderView {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    .folder-card {
      background: var(--bg-card);
      border: 2px dashed var(--neon-primary);
      padding: 15px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
    }
    .folder-card:hover {
      border-style: solid;
      box-shadow: 0 0 15px var(--neon-primary);
      transform: translateY(-2px);
    }
    
    /* GRID DE JUEGOS Y TARJETAS DE ROMS */
    .grid-juegos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 15px;
    }
    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--neon-primary);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }
    .card-img-wrapper img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--neon-secondary);
    }
    .card-info h3 { font-size: 0.9rem; color: #fff; margin-bottom: 8px; }

    /* BOTONES COMPACTOS DE ACCIÓN */
    .card-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }
    .btn-action {
      background-color: var(--neon-primary);
      color: var(--bg-dark);
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-action:hover {
      background-color: var(--bg-panel);
      transform: scale(1.1);
      outline: 1px solid var(--neon-primary);
    }
    .btn-download {
      background-color: var(--neon-secondary);
    }
    .btn-download:hover {
      outline-color: var(--neon-secondary);
    }

    .btn-volver {
      background-color: var(--neon-primary);
      color: var(--bg-dark);
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-volver:hover {
      background-color: var(--bg-panel);
      color: var(--neon-primary);
      outline: 1px solid var(--neon-primary);
    }
    
    /* CONTENEDOR EMULADOR Y CONTROLES */
    #emulatorModal {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #game {
      width: 100%;
      aspect-ratio: 3 / 2;
      max-height: 500px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--neon-primary);
      box-shadow: 0 0 25px var(--neon-primary);
    }
    .emulator-controls {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      width: 100%;
      justify-content: center;
    }
    @media (max-width: 768px) {
      #app-container { flex-direction: column; }
      aside { width: 100%; border-right: none; border-bottom: 2px solid var(--neon-primary); }
      main { padding: 15px; }
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE INICIO A PANTALLA COMPLETA -->
  <div id="welcome-screen">
    <div class="welcome-card">
      <h1>EMULADOR WEB</h1>
      
      <!-- BOTÓN INSTALAR APLICACIÓN (Automático si el navegador lo soporta) -->
      <button id="btn-install" class="console-btn btn-install-app hidden">
        <div class="btn-content">
          <span>📲 DESCARGAR APLICACIÓN</span>
        </div>
      </button>

      <div class="welcome-consoles">
        <!-- BOTÓN ACTIVO GBA -->
        <button id="btn-select-gba" class="console-btn active">
          <div class="btn-content">
            <img src="https://raw.githubusercontent.com/Lucas2026apks/Room-gba/main/gba.png" alt="GBA Icon" onerror="this.src='https://via.placeholder.com/26?text=GBA'">
            <span>GAME BOY ADVANCE</span>
          </div>
        </button>

        <!-- BOTONES DESACTIVADOS -->
        <button class="console-btn disabled" disabled>
          <div class="btn-content">
            <span>SNES</span>
          </div>
          <span class="badge-disabled">PRÓXIMAMENTE</span>
        </button>

        <button class="console-btn disabled" disabled>
          <div class="btn-content">
            <span>NINTENDO 64</span>
          </div>
          <span class="badge-disabled">PRÓXIMAMENTE</span>
        </button>

        <button class="console-btn disabled" disabled>
          <div class="btn-content">
            <span>NINTENDO DS</span>
          </div>
          <span class="badge-disabled">PRÓXIMAMENTE</span>
        </button>
      </div>
    </div>
  </div>

  <!-- INTERFAZ PRINCIPAL (OCULTA HASTA SELECCIONAR CONSOLA) -->
  <div id="app-container" class="hidden">
    <!-- BARRA LATERAL DE NAVEGACIÓN -->
    <aside>
      <div class="brand-sidebar">
        <h2>GAME BOY ADVANCE</h2>
        <button id="btn-change-console" class="btn-switch-console" title="Volver al menú de inicio">🏠 Inicio</button>
      </div>

      <nav>
        <button id="nav-btn-store" class="nav-btn active">📁 EXPLORADOR ROMS</button>
        <button id="nav-btn-emu" class="nav-btn nav-btn-secondary">🎮 EMULADOR</button>
        <button id="btn-goto-import" class="nav-btn nav-btn-secondary">📥 IMPORTAR .GBA</button>
        
        <!-- BOTÓN Y MENÚ PERSONALIZAR -->
        <button id="btn-toggle-theme" class="nav-btn nav-btn-secondary">🎨 PERSONALIZAR</button>
        <div id="theme-menu" class="theme-menu hidden">
          <button class="theme-opt" onclick="cambiarTema('default')">🌐 Default (Cyan)</button>
          <button class="theme-opt" onclick="cambiarTema('verde')">🟢 Verde Neón</button>
          <button class="theme-opt" onclick="cambiarTema('naranja')">🟠 Naranja Neón</button>
          <button class="theme-opt" onclick="cambiarTema('azul')">🔵 Azul Neón</button>
          <button class="theme-opt" onclick="cambiarTema('rojo')">🔴 Rojo Neón</button>
          <button class="theme-opt" onclick="cambiarTema('rosado')">💖 Rosado Neón</button>
          <button class="theme-opt" onclick="cambiarTema('rgb')">🌈 RGB Chroma (Teclado)</button>
        </div>

        <input type="file" id="rom-input" accept=".gba" style="display: none;">
      </nav>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
      <!-- EXPLORADOR DE CARPETAS Y ROMS -->
      <div id="store-section" class="container-panel">
        <h3 style="margin-bottom: 5px; color: #fff; text-shadow: 0 0 10px var(--neon-primary);">📚 BIBLIOTECA DE JUEGOS GBA</h3>
        <p style="font-size: 13px; color: var(--neon-secondary); margin-bottom: 20px;">SELECCIONA UNA CATEGORÍA O UN JUEGO PARA EMPEZAR:</p>
        
        <!-- Contenedor de carpetas -->
        <div id="folderView"></div>
        <!-- Contenedor de juegos dentro de carpeta -->
        <div id="folderContentView" class="hidden"></div>
      </div>

      <!-- CONTENEDOR DEL EMULADOR Y GUARDADO LOCAL -->
      <div id="emulatorModal" class="container-panel hidden">
        <div id="game"></div>
        <div class="emulator-controls">
          <button id="btn-save-local" class="btn btn-green">💾 GUARDAR PARTIDA LOCAL</button>
          <button id="btn-load-local" class="btn btn-yellow">📂 CARGAR PARTIDA LOCAL</button>
        </div>
      </div>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
